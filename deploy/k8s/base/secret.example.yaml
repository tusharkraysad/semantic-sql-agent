# NOT applied by kustomize. Create the real secret out of band, for example:
#   kubectl -n semantic-sql create secret generic llm-gateway \
#     --from-literal=LLM_PROVIDER=openai-compatible \
#     --from-literal=LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai \
#     --from-literal=LLM_API_KEY=... \
#     --from-literal=PLANNER_MODEL=... --from-literal=WRITER_MODEL=...
# In a cloud cluster, sync it from a secrets manager (External Secrets Operator)
# instead of typing keys into kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: llm-gateway
type: Opaque
stringData:
  LLM_PROVIDER: openai-compatible
  LLM_BASE_URL: https://example.invalid/v1
  LLM_API_KEY: replace-me
