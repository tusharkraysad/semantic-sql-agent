name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit tests, evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Evaluation gate (golden set, offline, logged to MLflow)
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
          STATE_DIR: /tmp/eval-state
          EVAL_TRIGGER: ci
        run: |
          python scripts/generate_data.py --out data
          python eval/run_eval.py --min-accuracy 0.95 --compare-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            eval/reports/
            mlflow.db

  airflow-dag:
    name: Airflow DAG parses (both run modes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow 2.10.5 with official constraints
        run: |
          pip install "apache-airflow[cncf.kubernetes]==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
      - name: Parse the DAG
        env:
          AIRFLOW_HOME: /tmp/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          airflow db migrate > /dev/null
          for mode in local kubernetes; do
            RUN_MODE=$mode python - <<'PY'
          import os
          from airflow.models import DagBag
          bag = DagBag(dag_folder="airflow/dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          dag = bag.get_dag("semantic_layer_refresh")
          print(os.environ["RUN_MODE"], "->", sorted(dag.task_ids))
          assert "evaluate" in dag.task_ids and "verify_api" in dag.task_ids
          PY
          done

  docker-kind:
    name: Docker build, then deploy to a kind cluster
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f docker/Dockerfile --target api -t semantic-sql-agent:ci .
          docker build -f docker/Dockerfile --target ui -t semantic-sql-agent-ui:ci .
          docker image ls | grep semantic-sql
      - name: Smoke-test the API container on its own
        run: |
          docker run -d --name api -p 8000:8000 -e AUTO_BUILD=1 -e GENERATE_DEMO_DATA=1 semantic-sql-agent:ci
          for i in $(seq 1 40); do curl -fs localhost:8000/ready && break; sleep 2; done
          curl -fs -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"Top 5 brands by revenue in 2025"}' -o answer.json
          python3 -c "import json; r=json.load(open('answer.json')); print(r['answer']); assert r['status']=='ok' and len(r['rows'])==5"
          docker inspect --format '{{.State.Health.Status}}' api
          docker rm -f api
      - uses: helm/kind-action@v1
        with:
          cluster_name: sqlagent
      - name: Load images into kind
        run: kind load docker-image semantic-sql-agent:ci semantic-sql-agent-ui:ci --name sqlagent
      - name: Deploy with kustomize
        run: |
          kubectl apply -k deploy/k8s/overlays/kind
          kubectl -n semantic-sql wait --for=condition=complete job/semantic-sql-preprocess --timeout=300s
          kubectl -n semantic-sql rollout status deploy/semantic-sql-api --timeout=300s
          kubectl -n semantic-sql rollout status deploy/semantic-sql-ui --timeout=300s
          kubectl -n semantic-sql get pods -o wide
      - name: Smoke-test through the Kubernetes Service
        run: |
          kubectl -n semantic-sql port-forward svc/semantic-sql-api 8000:8000 > /tmp/pf.log 2>&1 &
          for i in $(seq 1 20); do curl -fs localhost:8000/ready && break; sleep 2; done
          curl -fs localhost:8000/version
          curl -fs -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"Market share of velvet in skin care in apr-26"}' -o k8s.json
          python3 -c "import json; r=json.load(open('k8s.json')); print(r['answer']); assert r['status']=='ok'"
          curl -fs localhost:8000/metrics | grep '^sqlagent_questions_total'
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n semantic-sql get all,pvc,events || true
          kubectl -n semantic-sql describe pods || true
          kubectl -n semantic-sql logs -l app=semantic-sql --all-containers --tail=200 || true

  publish:
    name: Publish images to GHCR
    needs: [test, airflow-dag, docker-kind]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api, ui and tools images
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for target in api ui tools; do
            name=semantic-sql-agent
            [ "$target" != api ] && name=semantic-sql-agent-$target
            docker buildx build -f docker/Dockerfile --target $target \
              -t ghcr.io/$owner/$name:main -t ghcr.io/$owner/$name:${GITHUB_SHA::7} \
              --cache-from type=gha,scope=$target --cache-to type=gha,mode=max,scope=$target \
              --push .
          done
